name: Docker — Build & Release

on:
  push:
    tags:
      - "v*.*.*"           # triggers on v2.0.0, v2.1.0, etc.
  workflow_dispatch:       # manual trigger from Actions tab
    inputs:
      tag:
        description: "Image tag (e.g. latest, v2.0.0)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/salamanda-wids

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to upload release assets
      packages: write      # needed to push to GHCR
      id-token: write

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Derive clean version string (strips leading "v") ─────────────────
      - name: Set version env var
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ github.event.inputs.tag || 'latest' }}"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME:-$VER}" >> "$GITHUB_OUTPUT"

      # ── Set up QEMU for multi-arch builds (amd64 + arm64) ──────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── Set up Docker Buildx ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to GitHub Container Registry ───────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract metadata (tags + labels) ────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=SALAMANDA WIDS
            org.opencontainers.image.description=Smart Adaptive Local Area Monitoring And Network Defense Architecture
            org.opencontainers.image.vendor=SALAMANDA

      # ── Build and push multi-arch image (registry) ───────────────────────
      - name: Build and push Docker image (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── Export amd64 tarball for offline/air-gapped install ──────────────
      # Build single-arch into a local docker-tar OCI archive, then gzip it
      - name: Export image tarball (amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --output "type=docker,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.ver }}" \
            --load \
            . 2>&1 | tail -5
          docker save "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.ver }}" \
            | gzip > salamanda-wids-${{ steps.version.outputs.ver }}-linux-amd64.tar.gz
          echo "amd64 tarball: $(du -sh salamanda-wids-${{ steps.version.outputs.ver }}-linux-amd64.tar.gz)"

      # ── Create / update GitHub Release ──────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SALAMANDA WIDS ${{ steps.version.outputs.ver }}
          body: |
            ## SALAMANDA WIDS ${{ steps.version.outputs.ver }}

            ### Docker (recommended — all dependencies included)

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/salamanda-wids:${{ steps.version.outputs.ver }}
            docker run -d --name salamanda-wids \
              -p 3001:3000 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/salamanda-wids:${{ steps.version.outputs.ver }}
            ```

            Access the dashboard at **http://localhost:3001**

            ### Docker Compose

            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/.env.example
            cp .env.example .env   # edit as needed
            docker compose up -d
            ```

            For live Wi-Fi capture on Linux:
            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.override.example.yml
            cp docker-compose.override.example.yml docker-compose.override.yml
            # Edit CAPTURE_IFACE in docker-compose.override.yml
            docker compose up -d
            ```

            ### Offline / Air-gapped Install

            ```bash
            docker load < salamanda-wids-${{ steps.version.outputs.ver }}-linux-amd64.tar.gz
            docker run -d -p 3001:3000 ghcr.io/${{ github.repository_owner }}/salamanda-wids:${{ steps.version.outputs.ver }}
            ```

            ### Notes
            - **Windows / macOS**: runs in simulator mode (synthetic traffic). For native live capture on Windows, install [Npcap](https://npcap.com).
            - **Linux**: live capture works with `--cap-add=NET_RAW --cap-add=NET_ADMIN` (see `docker-compose.override.example.yml`).
            - Image digest: `${{ steps.build.outputs.digest }}`
          files: |
            salamanda-wids-${{ steps.version.outputs.ver }}-linux-amd64.tar.gz
            docker-compose.yml
            docker-compose.override.example.yml
            .env.example
          draft: false
          prerelease: false

  # ── Smoke test the pushed image ──────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start container
        run: |
          # Use the specific version tag (not latest) for reliability
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version || 'latest' }}"
          docker pull "$IMAGE" || docker pull "ghcr.io/${{ env.IMAGE_NAME }}:latest"
          docker run -d --name salamanda-test \
            -p 3001:3000 \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            "ghcr.io/${{ env.IMAGE_NAME }}:latest"
          sleep 30

      - name: Health check
        run: |
          STATUS=$(curl -sf http://localhost:3001/api/status | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('monitoring') else 'fail')" || echo "unreachable")
          echo "Status: $STATUS"
          [ "$STATUS" = "ok" ]

      - name: Stop container
        if: always()
        run: docker rm -f salamanda-test || true
