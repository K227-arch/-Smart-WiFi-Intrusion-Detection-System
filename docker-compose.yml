services:
  salamanda-wids:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salamanda-wids
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3001}
      # Network interface for live packet capture (Linux only)
      # Set CAPTURE_IFACE=wlan0 or your interface name
      CAPTURE_IFACE: ${CAPTURE_IFACE:-eth0}
      # BPF filter for captured traffic (optional)
      CAPTURE_FILTER: ${CAPTURE_FILTER:-}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - wids-data:/app/data
    # For live packet capture on Linux host, add:
    # cap_add:
    #   - NET_RAW
    #   - NET_ADMIN
    # network_mode: host
    # (then remove 'ports' section above)

volumes:
  wids-data:
    driver: local